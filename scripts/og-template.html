<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Fraunces";
        src: local("Fraunces");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        display: flex;
        background: #0f171c;
        color: #f1f5f7;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .left {
        flex: 1 1 auto;
        padding: 68px 0 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .eyebrow {
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #b4c24c;
        font-weight: 600;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        font-weight: 500;
        margin-top: 26px;
        max-width: 660px;
      }
      .role { font-size: 21px; color: #a8b8c2; line-height: 1.5; }
      .role strong { color: #f1f5f7; font-weight: 600; }
      .url { font-size: 19px; color: #e4589b; margin-top: 12px; letter-spacing: 0.01em; }
      .right {
        position: relative;
        flex: 0 0 430px;
        overflow: hidden;
      }
      .right img {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        width: 430px;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #0f171c 0%, rgba(15, 23, 28, 0) 26%);
      }
      .rule { width: 96px; height: 4px; background: #e4589b; margin-bottom: 30px; }
    </style>
  </head>
  <body>
    <div class="left">
      <div>
        <div class="rule"></div>
        <div class="eyebrow">Predictive science for drug delivery</div>
        <h1>I build models that decide which nanoparticles get made.</h1>
      </div>
      <div>
        <div class="role">
          <strong>Belal Hanafy, PhD</strong><br />
          Senior Scientist, Pharmaceutical Sciences &middot; AstraZeneca
        </div>
        <div class="url">belalhanafy.com</div>
      </div>
    </div>
    <div class="right">
      <img src="../public/covers/adhm-cover-960.jpg" alt="" />
      <div class="fade"></div>
    </div>
  </body>
</html>
